<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerPort | Deploy Asset</title>
    <style>
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 8s infinite alternate ease-in-out;
        }
        .orb-cyan { width: 350px; height: 350px; background: #0099ff; top: 5%; left: 15%; }
        .orb-orange { width: 300px; height: 300px; background: #6600ff; bottom: 5%; right: 15%; animation-delay: -4s; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.2); }
        }
         body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container { width: 100%; max-width: 600px; background: #111; padding: 40px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00e5ff; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #00e5ff; outline: none; background: #050505; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #00e5ff, #0077ff); color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 229, 255, 0.4); }
        .back-nav { margin-bottom: 20px; }
        .back-nav a { color: #888; text-decoration: none; font-size: 12px; border: 1px solid #333; padding: 6px 12px; border-radius: 4px; transition: 0.3s; }
        .back-nav a:hover { color: #fff; border-color: #00e5ff; }
        ::placeholder { color: #444; }
    </style>
</head>
<body>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-orange"></div>
    <div class="form-container">
        <div class="back-nav"><a href="/dashboard.html">← Back to Dashboard</a></div>
        <h2>Deploy New Asset</h2>
        
        <form action="/sell.html" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Asset Title</label>
                <input type="text" name="title" placeholder="e.g. Mini Drafter / Calculus Textbook" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" placeholder="Condition, usage period, or any missing parts..." required></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Original Price (₹)</label>
                    <input type="number" name="original_price" placeholder="MRP" min="0" required>
                </div>
                <div class="form-group">
                    <label>Selling Price (₹)</label>
                    <input type="number" name="price" placeholder="Your Price" min="0" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Department</label>
                    <select name="department" required>
                        <option value="" disabled selected>Select your department</option>
                        <option value="Humanities & Applied Science">Humanities & Applied Science</option>
                        <option value="IT">Information Technology</option>
                        <option value="CS">Computer Science</option>
                        <option value="Mech">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="DS">Data Science</option>
                        <option value="AIML">AI & ML</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Semester</label>
                    <select name="semester" required>
                        {% for i in range(1, 9) %}
                        <option value="Sem {{i}}">Semester {{i}}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Condition</label>
                <select name="condition" required>
                    <option value="New">New / Unused</option>
                    <option value="Like New">Like New / Mint</option>
                    <option value="Used">Used / Functional</option>
                    <option value="Fair">Fair / Worn</option>
                </select>
            </div>

            <div class="form-group">
                 <label>Upload Media (Max 5)</label>
                 <input type="file" name="images" multiple accept="image/*" required>
            </div>

            <button type="submit" class="btn">Deploy to Marketplace</button>
        </form>
    </div>
</body>
</html>
