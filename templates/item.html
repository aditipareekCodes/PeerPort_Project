<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerPort | {{ item.title }}</title>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050505; color: white; margin: 0; padding: 40px; }

        /* CONTAINER */
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 40px; 
            max-width: 1100px; 
            margin: 0 auto; 
            background: rgba(15, 15, 15, 0.85); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(0, 229, 255, 0.2); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            box-sizing: border-box;
        }

        .left-col { flex: 1.2; min-width: 350px; }
        .right-col { flex: 1; min-width: 350px; display: flex; flex-direction: column; }

        /* IMAGE */
        .img-wrapper {
            width: 100%;
            height: 450px;
            background-color: #000;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .main-img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            cursor: zoom-in;
        }

        .thumb-row { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }

        .thumb-img { 
            width: 70px; 
            height: 70px; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 2px solid transparent; 
            cursor: pointer; 
            opacity: 0.6; 
        }

        .thumb-img:hover { opacity: 1; border-color: #00e5ff; }

        /* MODAL (ZOOM) */
        .img-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .img-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }

        /* DETAILS */
        h1 { margin: 0 0 10px 0; font-size: 32px; }

        .badge { background: #222; padding: 5px 12px; border-radius: 6px; font-size: 12px; color: #ccc; border: 1px solid #333; }

        .price-box { padding: 20px; background: rgba(0,0,0,0.4); border-radius: 12px; border-left: 4px solid #00e5ff; margin: 20px 0; }

        .price-tag { color: #00e5ff; font-weight: bold; font-size: 36px; }

        .original-price { color: #666; text-decoration: line-through; font-size: 18px; margin-left: 10px; }

        .seller-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: #111; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }

        .seller-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #00e5ff; }

        .description-box { margin-bottom: 30px; color: #bbb; }

        .btn { 
            padding: 18px; 
            background: linear-gradient(45deg, #00e5ff, #0077ff); 
            color: black; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%;
        }

        .back-nav a { color: #888; text-decoration: none; }
    </style>
</head>

<body>

<div class="back-nav">
    <a href="/buy.html">← Return to Marketplace</a>
</div>

<div class="container">
    <div class="left-col">
        {% set images = item.image_file.split(',') %}

        <div class="img-wrapper">
            <img id="main-img"
                 src="{{ url_for('static', filename='uploads/' + images[0]) }}"
                 class="main-img"
                 onclick="openImg(this.src)"
                 onerror="this.src='/static/uploads/default_book.png'">
        </div>

        <div class="thumb-row">
            {% for img in images %}
            <img src="{{ url_for('static', filename='uploads/' + img) }}"
                 class="thumb-img"
                 onclick="document.getElementById('main-img').src=this.src; openImg(this.src);"
                 onerror="this.style.display='none'">
            {% endfor %}
        </div>
    </div>

    <div class="right-col">
        <h1>{{ item.title }}</h1>

        <div class="price-box">
            <span class="price-tag">₹{{ item.selling_price }}</span>
            {% if item.original_price and item.original_price > item.selling_price %}
            <span class="original-price">₹{{ item.original_price }}</span>
            {% endif %}
        </div>

        <div class="description-box">
            <p>{{ item.description }}</p>
        </div>

        <form action="/request_item/{{ item.item_id }}" method="POST">
            <button type="submit" class="btn">Confirm Request</button>
        </form>
    </div>
</div>

<!-- IMAGE MODAL -->
<div id="imgModal" class="img-modal" onclick="closeImg()">
    <img id="modalImg">
</div>

<script>
function openImg(src) {
    document.getElementById("imgModal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeImg() {
    document.getElementById("imgModal").style.display = "none";
}
</script>

</body>
</html>
