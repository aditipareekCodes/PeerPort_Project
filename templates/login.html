<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerPort | Secure Login</title>
    <style>
        /* --- Restoring your original CSS exactly --- */
        .back-nav {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 100;
        }
        .back-nav a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-nav a:hover {
            color: #fff;
            background: rgba(0, 229, 255, 0.1);
            border-color: rgba(0, 229, 255, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- Your Original Cyan & Orange Orbs --- */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 8s infinite alternate ease-in-out;
        }
        .orb-cyan { 
            width: 350px; height: 350px; background: #00ffff; 
            top: 5%; left: 15%; 
        }
        .orb-orange { 
            width: 300px; height: 300px; background: #ff6b00; 
            bottom: 5%; right: 15%; animation-delay: -4s; 
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.2); }
        }

        /* --- Your Original Card Style --- */
        .auth-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        0 0 20px rgba(0, 229, 255, 0.1);
            width: 100%;
            max-width: 400px;
            z-index: 1;
            transition: transform 0.3s ease;
        }
        
        .auth-container:hover {
            transform: translateY(-5px);
        }

        h2 {
            text-align: center;
            margin-bottom: 5px; 
            font-size: 32px;
            background: linear-gradient(90deg, #00e5ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            text-align: center;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #b3b3b3; margin-bottom: 8px; text-transform: uppercase; }
        
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        /* Your Original Orange Button */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff6b00, #ff8c00);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .link-text { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .link-text a { color: #00e5ff; text-decoration: none; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="orb orb-cyan"></div>
<div class="orb orb-orange"></div>

<div class="back-nav">
    <a href="/index.html">← Return to Home</a>
</div>

<div class="auth-container">
    
    <div id="login-section">
        <h2>PeerPort</h2>
        <p class="tagline">Resale Platform For Students</p>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label>8-Digit Moodle ID</label>
                <input type="text" name="moodle_id" placeholder="e.g. 24104027" 
                       pattern="\d{8}" maxlength="8" title="Must be exactly 8 digits" required>
            </div>
            <div class="form-group">
                <label>8-Digit Password</label>
                <input type="password" name="password" placeholder="••••••••" 
                       pattern="\d{8}" maxlength="8" title="Must be exactly 8 digits" required>
            </div>
            <button type="submit">LOGIN SYSTEM</button>
        </form>
        
        <div class="link-text">
            New recruit? <a onclick="showSection('register-section')">Initialize Registration</a>
        </div>
    </div>

    <div id="register-section" class="hidden">
        <h2>Create Access</h2>
        <p class="tagline">Join PeerPort</p>
        <form action="/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Aditi Pareek" required>
            </div>
            <div class="form-group">
                <label>Official Email</label>
                <input type="email" name="email" placeholder="ID@apsit.edu.in" 
                       pattern="[a-zA-Z0-9._%+-]+@apsit\.edu\.in$" required>
            </div>
            <div class="form-group">
                <label>8-Digit Password</label>
                <input type="password" name="password" pattern="\d{8}" maxlength="8" required>
            </div>
            <button type="submit" style="background: #00b8cc;">CREATE ACCOUNT</button>
        </form>
        <div class="link-text">
            <a onclick="showSection('login-section')">Return to Login</a>
        </div>
    </div>
</div>

<script>
    function showSection(sectionId) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('register-section').classList.add('hidden');
        document.getElementById(sectionId).classList.remove('hidden');
    }
</script>

</body>
</html>
