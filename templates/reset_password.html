<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerPort | Set New Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 8s infinite alternate ease-in-out;
        }
        .orb-cyan { width: 350px; height: 350px; background: #00ffff; top: 5%; left: 15%; }
        .orb-orange { width: 300px; height: 300px; background: #ff6b00; bottom: 5%; right: 15%; animation-delay: -4s; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.2); }
        }
        .auth-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
            background: linear-gradient(90deg, #00e5ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            text-align: center;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #b3b3b3; margin-bottom: 8px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #ff6b00, #ff8c00);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        small { color: #888; font-size: 11px; }
        .link-text { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .link-text a { color: #00e5ff; text-decoration: none; }
        .flash-danger { background: rgba(255,50,50,0.15); border: 1px solid rgba(255,50,50,0.3); color: #ff6b6b; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .flash-success { background: rgba(0,200,100,0.15); border: 1px solid rgba(0,200,100,0.3); color: #00e676; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    </style>
</head>
<body>
<div class="orb orb-cyan"></div>
<div class="orb orb-orange"></div>

<div class="auth-container">
    <h2>New Password</h2>
    <p class="tagline">Choose a strong password</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="/reset-password" method="POST">
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" id="new-password" required>
            <small>Min 8 chars · 1 uppercase · 1 lowercase · 1 number · 1 special character</small>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm-password" required>
        </div>
        <button type="submit">SET NEW PASSWORD</button>
    </form>

    <div class="link-text">
        <a href="/login.html">Back to Login</a>
    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const pw = document.getElementById('new-password').value;
        const cpw = document.getElementById('confirm-password').value;
        if (pw !== cpw) {
            alert('❌ Passwords do not match.');
            e.preventDefault(); return;
        }
        if (pw.length < 8) { alert('❌ Min 8 characters.'); e.preventDefault(); return; }
        if (!/[A-Z]/.test(pw)) { alert('❌ Need one uppercase letter.'); e.preventDefault(); return; }
        if (!/[a-z]/.test(pw)) { alert('❌ Need one lowercase letter.'); e.preventDefault(); return; }
        if (!/[0-9]/.test(pw)) { alert('❌ Need one number.'); e.preventDefault(); return; }
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(pw)) { alert('❌ Need one special character.'); e.preventDefault(); return; }
    });
</script>
</body>
</html>
