<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerPort | Settings</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050505; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 40px 20px; }
        
        .form-container { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(25px); padding: 40px; border-radius: 16px; border: 1px solid rgba(253, 216, 53, 0.2); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(253, 216, 53, 0.1); width: 100%; max-width: 500px; position: relative;}
        
        h2 { text-align: center; color: #fdd835; margin-top: 0; font-size: 28px; letter-spacing: 1px; }
        .tagline { text-align: center; color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #b3b3b3; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], input[type="tel"], select { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.6); border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: all 0.3s ease; }
        input:focus, select:focus { outline: none; border-color: #fdd835; box-shadow: 0 0 15px rgba(253, 216, 53, 0.3); background: rgba(0, 0, 0, 0.9); }

        /* File Upload Styling */
        input[type="file"] { background: rgba(0, 0, 0, 0.4); padding: 10px; border: 1px dashed #555; cursor: pointer; width: 100%; box-sizing: border-box; border-radius: 8px; color: #aaa; }

        button { width: 100%; padding: 16px; background: linear-gradient(45deg, #fbc02d, #f57f17); color: black; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(253, 216, 53, 0.4); color: white; }

        .back-nav { position: absolute; top: -50px; left: 0; }
        .back-nav a { color: #888; text-decoration: none; font-size: 13px; font-weight: bold; padding: 8px 16px; background: rgba(255,255,255,0.05); border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; }
        .back-nav a:hover { color: #fff; border-color: rgba(253, 216, 53, 0.5); }

        .alert-success { background: rgba(0, 230, 118, 0.1); border: 1px solid #00e676; color: #00e676; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        
        .avatar-container { text-align: center; margin-bottom: 25px; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #fdd835; box-shadow: 0 0 15px rgba(253, 216, 53, 0.3); }
    </style>
</head>
<body>

<div class="form-container">
    <div class="back-nav">
        <a href="/dashboard.html">← Back to Dashboard</a>
    </div>

    <h2>Profile Parameters</h2>
    <p class="tagline">Manage your identity and privacy</p>
    
    {% if success %}
    <div class="alert-success">✅ Profile parameters updated successfully.</div>
    {% endif %}

    <form action="/settings.html" method="POST" enctype="multipart/form-data">
        
        <div class="avatar-container">
            <img src="{{ url_for('static', filename='uploads/' + user.profile_pic) }}" class="avatar-preview" onerror="this.src='https://ui-avatars.com/api/?name={{ user.full_name }}&background=fdd835&color=000&bold=true'">
        </div>

        <div class="form-group">
            <label>Update Avatar</label>
            <input type="file" name="profile_pic" accept="image/*">
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ user.full_name }}" required>
        </div>

        <div class="form-group">
            <label>Phone Number / WhatsApp</label>
            <input type="tel" name="phone" placeholder="e.g. 9876543210" value="{{ user.phone }}">
        </div>

        <div class="form-group" style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px; border: 1px solid #333;">
            <label style="color: #fdd835;">Deal Room Privacy Mode</label>
            <p style="font-size: 11px; color: #888; margin-top: 0;">What contact info should buyers/sellers see when a deal is approved?</p>
            <select name="privacy_mode">
                <option value="Email Only" {% if user.privacy_mode == 'Email Only' %}selected{% endif %}>🔒 Strict: College Email Only</option>
                <option value="Phone & Email" {% if user.privacy_mode == 'Phone & Email' %}selected{% endif %}>📱 Open: Show Phone Number & Email</option>
            </select>
        </div>

        <button type="submit">Save Changes</button>
    </form>
</div>

</body>
</html>
